# Not required for local Milestone 1 (API runs on SQLite + local disk).
# This is the production-shaped stack we migrate to in Milestone 2+.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grailcard
      POSTGRES_PASSWORD: grailcard
      POSTGRES_DB: grailcard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: grailcard
      MINIO_ROOT_PASSWORD: grailcard-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
