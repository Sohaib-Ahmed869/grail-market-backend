# nginx site for the API. Copy it into place rather than pasting it:
#
#   sed 's/YOUR_DOMAIN/grail-market.duckdns.org/' deploy/nginx.conf \
#     | sudo tee /etc/nginx/conf.d/grail.conf
#
# A heredoc pasted into a terminal with bracketed paste turned on arrives with
# escape sequences in it and fails in a way that names neither nginx nor paste.
# A file in the repo has no such failure mode.
#
# Listens on 80 only. certbot adds the 443 server block, the certificate paths
# and the redirect when it runs — do not add them here by hand.
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Card photographs. nginx defaults to 1 MB, which rejects a phone photo
    # outright with a 413 before the API ever sees it.
    client_max_body_size 25m;

    # A scan reads the card, resolves it against several catalogues and prices
    # it — eleven seconds is normal, thirty happens. The 60s default is tight.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        # http, and correct: this hop never leaves the machine.
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
